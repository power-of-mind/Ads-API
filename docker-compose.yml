services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ads_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ads_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_user -d ads_db"]
      interval: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://ads_user:password@db:5432/ads_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data: